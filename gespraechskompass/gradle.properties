org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- App-Version ----------------------------------------------------------
# Bei jedem Update BEIDE Werte erhöhen: versionCode muss immer größer werden,
# sonst lässt Android die neue APK nicht über die alte installieren.
gk.versionCode=1
gk.versionName=1.0.0
