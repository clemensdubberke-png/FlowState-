name: Blitzeblank Android APK

on:
  push:
    paths:
      - 'haushalt/**'
      - 'haushalt-android/**'
      - '.github/workflows/blitzeblank-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blitzeblank-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Stable signing key from repository secrets (so updates install over the old app).
      # Without secrets a throw-away key is generated – the APK works, but updates then
      # require uninstalling first.
      - name: Prepare signing key
        id: key
        env:
          KS_B64: ${{ secrets.BLITZEBLANK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > haushalt-android/app/release.keystore
            echo "Using keystore from secrets"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore haushalt-android/app/release.keystore \
              -storepass blitzeblank -keypass blitzeblank -alias blitzeblank \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Blitzeblank"
            echo "::warning::No BLITZEBLANK_KEYSTORE_BASE64 secret – using a temporary signing key (uninstall the old app before installing)"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BLITZEBLANK_KEYSTORE_PASSWORD || 'blitzeblank' }}
          KEY_PASSWORD: ${{ secrets.BLITZEBLANK_KEY_PASSWORD || secrets.BLITZEBLANK_KEYSTORE_PASSWORD || 'blitzeblank' }}
          KEY_ALIAS: ${{ secrets.BLITZEBLANK_KEY_ALIAS || 'blitzeblank' }}
        run: gradle -p haushalt-android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp haushalt-android/app/build/outputs/apk/release/app-release.apk "dist/Blitzeblank-1.0.${BUILD_NUMBER}.apk"
          cp haushalt-android/wear/build/outputs/apk/release/wear-release.apk "dist/Blitzeblank-Uhr-1.0.${BUILD_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Blitzeblank-1.0.${{ github.run_number }}
          path: dist/*.apk

      # With the permanent key (repository secrets) every release installs as an update.
      # Without it the release is still published, but must be installed after uninstalling the old app.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blitzeblank-v1.0.${{ github.run_number }}
          name: Blitzeblank 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            **Blitzeblank – Putzplan für die Familie** (Android-App)

            Installation: APK unten auf dem Handy antippen → herunterladen → öffnen.
            Beim ersten Mal fragt Android, ob Installationen aus dieser Quelle erlaubt sind → „Zulassen“.
            Ab Version mit festem Schlüssel installiert sich jede neue Version einfach über die alte – alle Daten bleiben erhalten.

            **Blitzeblank-Uhr-…apk** ist die Wear-OS-App (z. B. Pixel Watch): Putz-Timer und fällige Aufgaben, synchron mit dem Handy.
            Installation auf der Uhr per ADB über WLAN (Entwickleroptionen → Kabelloses Debugging): `adb install Blitzeblank-Uhr-….apk`.
