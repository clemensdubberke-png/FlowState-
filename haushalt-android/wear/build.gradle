plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()

android {
    namespace 'de.blitzeblank.wear'
    compileSdk 35

    defaultConfig {
        // Same package name and signing key as the phone app – required for the phone<->watch sync.
        applicationId 'de.blitzeblank.app'
        minSdk 30
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../app/release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "blitzeblank"
            keyAlias System.getenv("KEY_ALIAS") ?: "blitzeblank"
            keyPassword System.getenv("KEY_PASSWORD") ?: "blitzeblank"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
